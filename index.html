<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gráfica interactiva de la evolución tecnológica histórica: del fuego al año 10^100.">
<style>*{box-sizing:border-box}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Gráfica de la evolución tecnológica histórica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>window.react=window.React</script>
<script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<style>
/* Layout: escenario a pantalla completa con cámara libre (zoom/arrastre) sobre la curva; HUD inferior compacto. Mundo oscuro único. */
:root{
  --bg:#05070d; --ink:#eef3ff; --muted:#8d9bb8; --line:#1b2440; --card:#0b1020;
  --amber:#f2a33a; --neon:#38c8ff; --violet:#a283ff;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);overflow-x:hidden;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#root{height:100%;max-width:1200px;margin:0 auto}
.app{box-sizing:border-box;height:100%;min-height:560px;display:flex;flex-direction:column;gap:10px;padding-block:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:clamp(15px,3vw,24px);text-wrap:balance;letter-spacing:-.01em;line-height:1}
.brand b{background:linear-gradient(90deg,var(--amber),var(--neon) 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:#0d1222;border:1px solid var(--line)}
.seg button{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;color:var(--muted);font:600 13px var(--f-body);background:none;border:0;cursor:pointer;transition:all .3s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:#05070d}
.seg.sm button{padding:5px 10px;font-size:12px}
.stage{position:relative;flex:1;min-height:280px;border-radius:20px;overflow:hidden;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;transition:background 1.1s ease;cursor:grab}
.stage.dragging{cursor:grabbing}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cam{transition:transform 1.15s cubic-bezier(.65,0,.25,1);transform-origin:0 0}
.cam.instant{transition:none}
.cam.soft{transition:transform .35s ease-out}
.vig{cursor:pointer;transition:opacity .8s}
.seg-path{transition:stroke-opacity .8s, stroke-width .8s}
.ctl{position:absolute;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(5,7,13,.75);border:1px solid rgba(255,255,255,.14);color:var(--ink);cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .2s,opacity .3s}
.ctl:hover{transform:scale(1.07)}
.ctl:disabled{opacity:.25;cursor:default;transform:none}
.zoomstack{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoomstack .ctl{position:static;width:36px;height:36px}
.hint{position:absolute;left:12px;bottom:12px;font:500 11px var(--f-mono);color:var(--muted);background:rgba(5,7,13,.7);padding:5px 9px;border-radius:8px;pointer-events:none;max-width:calc(100% - 80px)}
.hud{display:flex;flex-direction:column;gap:8px}
.card{border-radius:18px;padding:12px 16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:5px;min-height:112px}
.card.enter{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.pill{padding:3px 8px;border-radius:6px;color:#05070d;font-weight:500}
.title{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,3.6vw,25px);line-height:1.12;text-wrap:balance}
.fact{font-size:15.5px;line-height:1.45;color:#d6def0;max-width:70ch}
.why{font-size:14.5px;line-height:1.5;color:var(--muted);max-width:70ch}
.whybtn{align-self:flex-start;display:flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;color:var(--ink);font:600 13px var(--f-body);cursor:pointer}
.nav{display:flex;align-items:center;gap:8px}
.nav .btn{display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--f-body);cursor:pointer;padding:0 14px}
.nav .btn:disabled{opacity:.3;cursor:default}
.nav .btn.main{flex:1;background:var(--ink);color:#05070d;border-color:var(--ink)}
.dots{display:flex;gap:5px;justify-content:center;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;border:0;padding:0;cursor:pointer;opacity:.4;transition:all .35s}
.dot[aria-current="true"]{opacity:1;transform:scale(1.6);box-shadow:0 0 10px currentColor}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--neon),var(--violet) var(--p),#1b2440 var(--p))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--neon),var(--violet) var(--p),#1b2440 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(162,131,255,.35),0 0 18px var(--violet)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px rgba(162,131,255,.35),0 0 18px var(--violet)}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:500 12px var(--f-mono);color:var(--muted)}
/* Datos */
.data{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.dpanel{border-radius:20px;border:1px solid var(--line);background:radial-gradient(120% 80% at 80% 0%,#0a1630,#05070d 70%);padding:12px;display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,9vw,72px);line-height:.95;background:linear-gradient(90deg,var(--neon),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.stmt{font-size:15.5px;line-height:1.45;color:#d6def0;max-width:56ch}
.stmt b{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 12.5px var(--f-body);cursor:pointer}
.chips button[aria-pressed="true"]{color:#05070d;background:var(--neon);border-color:var(--neon)}

/* Animaciones de escenas */
.a-glow{transform-box:fill-box;transform-origin:center;animation:aglow 2.6s ease-in-out infinite alternate}
@keyframes aglow{from{transform:scale(.9)}to{transform:scale(1.08)}}
.a-flick{transform-box:fill-box;transform-origin:50% 100%;animation:aflick .35s ease-in-out infinite alternate}
@keyframes aflick{from{transform:scale(1,1)}to{transform:scale(.92,1.1)}}
.a-rise{animation:arise 3s linear infinite}
@keyframes arise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-34px);opacity:0}}
.a-float{animation:afloat 3.2s ease-in-out infinite alternate}
@keyframes afloat{from{transform:translateY(3px)}to{transform:translateY(-4px)}}
.a-spin{transform-box:fill-box;transform-origin:center;animation:aspin 9s linear infinite}
@keyframes aspin{to{transform:rotate(360deg)}}
/* Odómetro y velocidad */
.odo{position:absolute;left:12px;top:12px;pointer-events:none;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 120px)}
.odo .lab{font:500 10px var(--f-mono);letter-spacing:.2em;color:var(--muted)}
.odo .num{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,5.4vw,40px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.odo .bar{width:150px;max-width:100%;height:5px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.odo .bar i{display:block;height:100%;border-radius:4px;transition:width 1.1s cubic-bezier(.65,0,.25,1)}
.odo .sp{font:500 11px var(--f-mono);color:#d6def0}
.flash{position:absolute;inset:0;pointer-events:none;animation:flash 1.2s ease-out both}
@keyframes flash{from{opacity:.55}to{opacity:0}}
.stars{transition:transform 1.15s cubic-bezier(.65,0,.25,1)}
.mini{display:block;width:100%;touch-action:none;cursor:pointer}
/* Escalera del cómputo */
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:6px 8px;color:var(--ink);cursor:pointer}
.rung:hover,.rung[aria-expanded="true"]{border-color:var(--line);background:rgba(255,255,255,.02)}
.rung .ex{font:500 13px var(--f-mono);text-align:right}
.rung .ex sup{font-size:.7em}
.rung .bar2{height:7px;border-radius:5px;margin-top:4px}
.rung .t{font-weight:600;font-size:14px}
.rung .d{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:4px}

.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:-2px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 12.5px var(--f-body);cursor:pointer;transition:all .25s}
.cats button[aria-pressed="true"]{color:var(--ink);border-color:var(--cc);box-shadow:0 0 14px color-mix(in srgb,var(--cc) 35%,transparent);background:color-mix(in srgb,var(--cc) 12%,var(--card))}
.cats .n{font:500 10.5px var(--f-mono);opacity:.7}
.status{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--muted);line-height:1.4}
.status b{color:var(--ink);font-weight:600}
.vida{display:inline-flex;align-items:center;gap:5px;color:#ff9cc4;font:500 12px var(--f-mono)}
.odo .rate{font-family:var(--f-display);font-weight:700;font-size:clamp(14px,3.6vw,18px);line-height:1.15}
.ratecmp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted)}
.ratecmp b{font-family:var(--f-display);font-size:clamp(14px,3.6vw,17px);font-weight:700}
.ritmo{position:absolute;left:10px;top:10px;padding:8px 10px;border-radius:12px;background:rgba(5,7,13,.8);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none;display:flex;flex-direction:column;gap:3px;max-width:calc(100% - 70px)}
.ritmo .rt{font:500 9.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.rrow{display:grid;grid-template-columns:62px 44px auto;gap:6px;align-items:center;font-size:10.5px;line-height:1.35}
.rrow .rn{color:#c9d3e8;white-space:nowrap;font:500 10px var(--f-mono)}
.rrow b{font:600 10.5px var(--f-mono);white-space:nowrap}
.rrow .rb{height:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.rrow .rb i{display:block;height:100%;border-radius:4px}
.mrail{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 4px;flex:0 0 auto}
.mrail::-webkit-scrollbar{display:none}
.mrail button{scroll-snap-align:start;flex:0 0 132px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:2px 8px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;transition:border-color .25s,background .25s,color .25s}
.mrail .mi{grid-row:1/3;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.05)}
.mrail .mg{font:500 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.mrail .mn{font:600 13px/1.2 var(--f-body);color:var(--ink)}
.mrail button[aria-pressed="true"]{border-color:var(--neon);background:color-mix(in srgb,var(--neon) 10%,var(--card));color:var(--neon)}
.mrail button[aria-pressed="true"] .mi{background:var(--neon);color:#05070d}
.dhead{display:flex;gap:6px 16px;align-items:flex-end;flex-wrap:wrap}
.dhead .stmt{flex:1 1 220px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis div{display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-width:0}
.kpis span{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.25}
.kpis b{font-family:var(--f-display);font-size:clamp(13px,3.6vw,18px);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.ctl-block{display:flex;flex-direction:column;gap:2px}
.dctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
.dctl .dl{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg.full{display:flex;min-width:0}
.seg.full button{flex:1;justify-content:center;padding-left:4px;padding-right:4px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:rgba(255,181,71,.07);border:1px solid rgba(255,181,71,.22);font-size:14px;line-height:1.5;color:#e6dcc8}
.note svg{flex:0 0 auto;margin-top:2px}
.src{font-size:11.5px;color:var(--muted);line-height:1.45}
.dtip{position:absolute;top:24px;width:220px;background:#0b1020;border:1px solid #ffb547;border-radius:12px;padding:8px 10px;font-size:13px}
.dtip button{margin-top:4px;background:none;border:0;padding:0;color:var(--neon);font:600 12.5px var(--f-body);cursor:pointer}
button:focus-visible,input:focus-visible,.vig:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(3);opacity:0}}
.twinkle{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.cam,.stage,.vig,.seg-path,.stars,.odo .bar i{transition:none!important}*{animation:none!important}}
</style>

const fmtInt=n=>{const s=String(Math.round(Math.abs(n)));return (n<0?"-":"")+(s.length>4?s.replace(/\B(?=(\d{3})+(?!\d))/g,"."):s)};
const fmtYear=y=>y==null?"∞":y>=1e6?yearLabel(y):y<0?fmtInt(-y)+" a.C.":String(Math.round(y));
function gapOf(a,b){if(!a||b.year==null||a.year==null)return null;return Math.max(0,Math.round(b.year-a.year))}
function gapLabel(a,b,future){future=b&&b.fut&&a&&a.year>=NOW;const g=gapOf(a,b);if(g==null)return"?";if(g===0)return"mismo año";return (future?"+":"")+bigNum(g)+(g===1?" año":" años")}

function bigNum(g){g=Math.round(g);if(g<1e6)return fmtInt(g);if(g<1e9){const v=g/1e6;return (v%1?v.toFixed(1).replace(".",","):fmtInt(v))+" millones"}if(g<1e12){const v=g/1e9;return (v%1?v.toFixed(1).replace(".",","):fmtInt(v*1000))+" millones"}return "10"+sup(Math.round(Math.log10(g)))}

/* ───────── Geometría ───────── */
const S=420,VW=240,VH=172;
const expo=(x,k)=>(Math.exp(k*x)-1)/(Math.exp(k)-1);
const TH=2200,TEND=2100,LMAX=Math.log10(TH+400000),TU=2400;
const TX=y=>120+(LMAX-Math.log10(TH-y))*TU;
const TICKS=[-100000,-10000,-1000,1000,1500,1800,1900,1950,2000,2050,2100];
function layout(stops,k){
  const n=stops.length,DY=112;
  const xs=[];let bi=-1;for(let i=0;i<n;i++){const y=stops[i].year;if(y!=null&&y<=TEND)xs.push(TX(y));else{if(bi<0)bi=i;xs.push(TX(TEND)+60+(i-bi)*14)}}
  const BASE=(n-1)*DY+320;
  const pts=stops.map((s,i)=>({x:xs[i],y:BASE-i*DY,side:i%2?"L":"R"}));
  const cr=(p0,p1,p2,p3)=>{const t=6;return [p1.x+(p2.x-p0.x)/t,p1.y+(p2.y-p0.y)/t,p2.x-(p3.x-p1.x)/t,p2.y-(p3.y-p1.y)/t]};
  const segs=[];let full=`M${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<n-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const[c1x,c1y,c2x,c2y]=cr(p0,p1,p2,p3);
    const c=`C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y}`;full+=" "+c;
    segs.push({d:`M${p1.x.toFixed(1)} ${p1.y} ${c}`,mx:.125*p1.x+.375*c1x+.375*c2x+.125*p2.x,my:.125*p1.y+.375*c1y+.375*c2y+.125*p2.y});}
  const lead=`M${pts[0].x-700} ${BASE+4} L${pts[0].x} ${pts[0].y}`;
  const minX=-360,maxX=pts[n-1].x+VW+120,minY=pts[n-1].y-VH-120,maxY=BASE+VH+120;
  return {pts,segs,full,lead,base:BASE,bi,box:{x:minX,y:minY,w:maxX-minX,h:maxY-minY}};
}
function useSize(ref){const[s,setS]=useState({w:360,h:420});useEffect(()=>{if(!ref.current)return;const ro=new ResizeObserver(e=>{const r=e[0].contentRect;setS({w:Math.max(240,r.width),h:Math.max(60,r.height)})});ro.observe(ref.current);return()=>ro.disconnect()},[]);return s}

/* ───────── Odómetro de años ───────── */
function Odometer({stop,prev,overview,future,n,i}){
  const [shown,setShown]=useState(stop.year);
  const cur=useRef(stop.year);
  useEffect(()=>{const to=stop.year;if(to==null||cur.current==null||Math.abs(to)>=1e6||Math.abs(cur.current)>=1e6){cur.current=to;setShown(to);return}
    const from=cur.current;const t0=performance.now();const D=1100;let raf;
    const step=t=>{const p=Math.min(1,(t-t0)/D);const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;const v=from+(to-from)*e;cur.current=v;setShown(v);if(p<1)raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);return()=>cancelAnimationFrame(raf)},[stop.id]);
  if(overview)return null;
  const g=gapOf(prev,stop);
  const r=localRate(ALL,ALL.findIndex(s=>s.id===stop.id));
  const speed=r==null?1:Math.max(0.04,Math.min(1,(Math.log10(r)-RMIN)/(RMAX-RMIN)));
  return html`<div className="odo">
    <span className="lab">${stop.fut?"AÑO PROYECTADO":"AÑO"}</span>
    <span className="num" style=${{color:stop.c,textShadow:`0 0 24px ${stop.c}66`}}>${fmtYear(shown==null?null:Math.abs(shown)>=1e6?shown:Math.round(shown))}</span>
    <span className="rate" style=${{color:stop.c}}>${r==null?"más allá de toda escala":rateText(r)}</span>
    <div className="bar"><i style=${{width:speed*100+"%",background:`linear-gradient(90deg,#f2a33a,#38c8ff 70%,#a283ff)`}}></i></div>
  </div>`;
}

function MiniMap({stops,idx,overview,k,onPick}){
  const ref=useRef(null);const {w}=useSize(ref);const h=54;
  const n=stops.length;const LG=useMemo(()=>layout(stops,k),[stops]);const X0=LG.pts[0].x,XW=LG.pts[n-1].x-X0,YB=LG.pts[0].y,YH=YB-LG.pts[n-1].y;
  const px=i=>10+(LG.pts[i].x-X0)/XW*(w-20),py=i=>h-8-(h-16)*(YB-LG.pts[i].y)/YH;
  const d=stops.map((_,i)=>(i?"L":"M")+px(i).toFixed(1)+" "+py(i).toFixed(1)).join(" ");
  const dl=stops.slice(0,idx+1).map((_,i)=>(i?"L":"M")+px(i).toFixed(1)+" "+py(i).toFixed(1)).join(" ");
  const down=useRef(false);const last=useRef(-1);
  const at=e=>{const r=ref.current.getBoundingClientRect();const x=e.clientX-r.left;let bi=0,bd=1e9;for(let i=0;i<n;i++){const d=Math.abs(px(i)-x);if(d<bd){bd=d;bi=i}}return bi};
  const set=e=>{const i=at(e);if(i!==last.current){last.current=i;onPick(i)}};
  return html`<div ref=${ref}><svg className="mini" width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} role="slider" aria-label="Recorrer los hitos" aria-valuemin="1" aria-valuemax=${n} aria-valuenow=${idx+1}
     onPointerDown=${e=>{down.current=true;last.current=-1;set(e)}} onPointerMove=${e=>{if(down.current)set(e)}} onPointerUp=${()=>down.current=false} onPointerLeave=${()=>down.current=false}>
    <defs><linearGradient id="mg" x1="0" x2="1"><stop offset="0" stopColor="#f2a33a"/><stop offset=".65" stopColor="#38c8ff"/><stop offset="1" stopColor="#a283ff"/></linearGradient></defs>
    <path d=${d} fill="none" stroke="#24305a" strokeWidth="2"/>
    ${!overview&&html`<path d=${dl} fill="none" stroke="#38c8ff" strokeWidth="3"/>`}
    ${stops.map((s,i)=>html`<circle key=${s.id} cx=${px(i)} cy=${py(i)} r=${!overview&&i===idx?6:2.6} fill="#ffb547" opacity=${overview||i<=idx?1:0.45} style=${{transition:"r .3s"}}/>`)}
    ${!overview&&html`<circle cx=${px(idx)} cy=${py(idx)} r="11" fill="none" stroke=${stops[idx].c} strokeOpacity=".5"/>`}
  </svg></div>`;
}

 {e:50.7,name:"Límite físico: 1 kg de materia",when:"∞",c:"#ffe2b0",d:"El «portátil definitivo» de Seth Lloyd: 5×10⁵⁰ operaciones por segundo. Para lograrlo, la materia tendría que ser casi un agujero negro.",fut:true}
];
function Ladder(){
  const [open,setOpen]=useState(8);
  const sup=e=>html`10<sup>${Math.round(e)}</sup>`;
  return html`<div className="ladder">
    <div className="stmt">Operaciones por segundo, en escala logarítmica: cada marca multiplica por 10. Toca un peldaño.</div>
    ${LADDER.map((r,i)=>html`<button key=${i} className="rung" aria-expanded=${open===i?"true":"false"} onClick=${()=>setOpen(open===i?-1:i)}>
      <span className="ex" style=${{color:r.c}}>${r.q?"≠":sup(r.e)}</span>
      <span style=${{minWidth:0}}>
        <span className="t">${r.name}</span> <span style=${{font:"500 11px var(--f-mono)",color:"var(--muted)"}}>· ${r.when}${r.fut?" · proyección":""}</span>
        ${r.q?html`<div className="bar2" style=${{width:"100%",background:"repeating-linear-gradient(90deg,#a283ff 0 6px,transparent 6px 12px)"}}></div>`
          :html`<div className="bar2" style=${{width:Math.max(2,r.e/51*100)+"%",background:`linear-gradient(90deg,#f2a33a,${r.c})`,opacity:r.fut?.7:1}}></div>`}
        ${open===i&&html`<div className="d">${r.d}</div>`}
      </span>
    </button>`)}
  </div>`;
}

function DataView({onJump}){
  const [metric,setMetric]=useState("pop");
  const [from,setFrom]=useState(null);
  const [logY,setLogY]=useState(false);
  const [wi,setWi]=useState(4);
  const [tip,setTip]=useState(null);
  const ref=useRef(null);const {w}=useSize(ref);
  const railRef=useRef(null);
  useEffect(()=>{const el=railRef.current&&railRef.current.querySelector('[aria-pressed="true"]');if(el)try{el.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"})}catch(e){}},[metric]);
  const pick=k=>{setMetric(k);setTip(null);setFrom(null);if(SERIES[k])setLogY(!!(SERIES[k].log||(SERIES[k].down&&!SERIES[k].pctDown)));const s=SERIES[k];if(s){const span=NOW-s.s0;setWi(span>3000?4:span>150?3:1)}};
  const keys=[...Object.keys(SERIES),"ladder"];
  const rail=html`<div className="mrail" ref=${railRef} role="tablist" aria-label="Indicador">
      ${keys.map(k=>{const s=SERIES[k];const on=metric===k;return html`<button key=${k} role="tab" aria-pressed=${on?"true":"false"} onClick=${()=>pick(k)}>
        <span className="mi"><${Ic} n=${s?s.icon:"Gauge"} size=${16}/></span>
        <span className="mg">${s?s.group:"Tecnología"}</span>
        <span className="mn">${s?s.name:"Escalera del cómputo"}</span>
      </button>`})}
    </div>`;
  if(metric==="ladder")return html`<div className="data">${rail}<div className="dpanel"><${Ladder}/></div></div>`;
  const ser=SERIES[metric];
  const span=NOW-ser.s0;
  const WIN=[5,10,25,50,75,100,250,500,1000,2000,5000].filter(n=>n<span).concat([span]);
  const wiC=Math.min(wi,WIN.length-1);const N=WIN[wiC];
  const FROMS=[null,...[1500,1900,1970,2000,2015].filter(y=>y>ser.s0+(span*0.05)&&y<NOW-8)].slice(0,4);
  const fromC=FROMS.includes(from)?from:null;
  const Hh=Math.round(Math.min(340,Math.max(210,w*0.6)));
  const PL=6,PR=6,PT=26,PB=26,iw=w-PL-PR,ih=Hh-PT-PB;
  const d0=fromC==null?ser.s0:fromC,d1=NOW;
  const X=y=>PL+(y-d0)/(d1-d0)*iw;
  const vs=Array.from({length:240},(_,i)=>val(ser,d0+(d1-d0)*i/239));
  const vmax=Math.max(...vs),vmin=Math.min(...vs);
  const Y=v=>logY?PT+ih-(Math.log(v)-Math.log(vmin))/((Math.log(vmax)-Math.log(vmin))||1)*ih:PT+ih-(ser.down?(v-0)/vmax:v/vmax)*ih;
  const line=vs.map((v,i)=>(i?"L":"M")+X(d0+(d1-d0)*i/239).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const area=line+` L${X(d1)} ${PT+ih} L${X(d0)} ${PT+ih}Z`;
  const ws=Math.max(d0,NOW-N);
  const v0=val(ser,ser.s0),vNow=val(ser,NOW),vW=val(ser,NOW-N);
  const gain=(vNow-vW)/(vNow-v0);
  const tshare=N/span;
  const mult=ser.down?v0/vNow:vNow/v0;
  const hitos=HIST.filter(m=>m.year!=null&&m.year<=NOW&&m.year>=d0);
  const nT=w<500?3:5,rq=(d1-d0)>2000?1000:(d1-d0)>300?50:(d1-d0)>40?10:5;
  const ticks=Array.from({length:nT},(_,i)=>i===0?d0:i===nT-1?d1:Math.round((d0+(d1-d0)*i/(nT-1))/rq)*rq);
  const pct=x=>x>=0.995?"99":x<0.01?(x*100).toFixed(1).replace(".",","):Math.round(x*100);
  const mfmt=x=>x>=1e6?fmtSci(x):x>=100?fmtInt(x):x.toFixed(1).replace(".",",");const multTxt=mfmt(mult);const wMultTxt=mfmt(vW/vNow);
  const endLab=ser.fmt(vNow),startLab=ser.fmt(v0);
  const yEnd=Y(vNow);

  return html`<div className="data">
    ${rail}
    <div className="dpanel">
      <div className="dhead">
        ${ser.down&&!ser.pctDown?html`<div className="big">÷${wMultTxt}</div>
        <div className="stmt">En los <b>últimos ${fmtInt(N)} años</b> el ${ser.name.charAt(0).toLowerCase()+ser.name.slice(1)} se ha dividido entre <b>${wMultTxt}</b>.</div>`
        :html`<div className="big">${pct(gain)}%</div>
        <div className="stmt">de toda la ${ser.down?"caída":"subida"} de <b>${ser.name.charAt(0).toLowerCase()+ser.name.slice(1)}</b> ocurrió en los <b>últimos ${fmtInt(N)} años</b>, solo el <b>${pct(tshare)} %</b> del periodo.</div>`}
      </div>
      <div className="kpis">
        <div><span>${fmtYear(ser.s0)}</span><b>${startLab}</b></div>
        <div><span>Hoy</span><b style=${{color:"var(--neon)"}}>${endLab}</b></div>
        <div><span>${ser.down?"Dividido":"Multiplicado"}</span><b style=${{color:"var(--violet)"}}>${ser.down?"÷":"×"}${multTxt}</b></div>
      </div>
      <div className="ctl-block">
        <div className="srow"><span>Últimos <b style=${{color:"var(--ink)"}}>${fmtInt(N)} años</b></span><span>desde ${fmtYear(NOW-N)}</span></div>
        <input id="ventana" type="range" min="0" max=${WIN.length-1} step="1" value=${wiC} style=${{"--p":(wiC/(WIN.length-1)*100)+"%"}} aria-label="Ventana de años" onInput=${e=>setWi(+e.target.value)} onChange=${e=>setWi(+e.target.value)}/>
      </div>
      <div ref=${ref} style=${{position:"relative"}}>
        <svg width=${w} height=${Hh} viewBox=${`0 0 ${w} ${Hh}`} style=${{display:"block",maxWidth:"100%"}} role="img" aria-label=${"Gráfico de "+ser.name}>
          <defs><linearGradient id="dA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#38c8ff" stopOpacity=".35"/><stop offset="1" stopColor="#38c8ff" stopOpacity="0"/></linearGradient>
          <linearGradient id="dL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stopColor="#f2a33a"/><stop offset=".7" stopColor="#38c8ff"/><stop offset="1" stopColor="#a283ff"/></linearGradient></defs>
          ${[0.25,0.5,0.75].map(t=>html`<line key=${t} x1=${PL} x2=${w-PR} y1=${PT+ih*t} y2=${PT+ih*t} stroke="#1b2440" strokeDasharray="2 6"/>`)}
          <rect x=${X(ws)} y=${PT} width=${Math.max(2,X(d1)-X(ws))} height=${ih} fill="#a283ff" opacity=".14"/>
          <line x1=${X(ws)} x2=${X(ws)} y1=${PT} y2=${PT+ih} stroke="#a283ff" strokeDasharray="3 4"/>
          <path d=${area} fill="url(#dA)"/>
          <path d=${line} fill="none" stroke="url(#dL)" strokeWidth="3" strokeLinejoin="round"/>
          <circle cx=${X(d1)} cy=${yEnd} r="5" fill="#a283ff"/>
          <text x=${X(d1)-8} y=${yEnd<PT+30?yEnd+18:yEnd-10} textAnchor="end" fill="#eef3ff" fontSize="12" fontFamily="JetBrains Mono, monospace">${endLab}</text>
          <line x1=${PL} x2=${w-PR} y1=${PT+ih} y2=${PT+ih} stroke="#24305a"/>
          ${ticks.map((t,i)=>html`<text key=${i} x=${X(t)} y=${Hh-6} textAnchor=${i===0?"start":i===nT-1?"end":"middle"} fill="#8d9bb8" fontSize="11" fontFamily="JetBrains Mono, monospace">${fmtYear(t)}</text>`)}
          ${hitos.map(m=>html`<g key=${m.id} style=${{cursor:"pointer"}} onClick=${()=>setTip(m.id===tip?null:m.id)}>
            <circle cx=${X(m.year)} cy=${PT+ih} r="11" fill="transparent"/>
            <circle cx=${X(m.year)} cy=${PT+ih} r=${tip===m.id?6:4} fill="#ffb547" stroke="#05070d" strokeWidth="1.5"/></g>`)}
        </svg>
        ${tip&&(()=>{const m=HIST.find(x=>x.id===tip);if(!m)return null;const left=Math.min(Math.max(0,X(m.year)-110),w-220);return html`<div className="dtip" style=${{left}}>
          <div style=${{font:"500 11px var(--f-mono)",color:"#ffb547"}}>${m.label}</div><div style=${{fontWeight:600}}>${m.title}</div>
          <button onClick=${()=>onJump(m.id)}>Ver en la curva →</button></div>`})()}
      </div>
      <div className="dctl">
        <span className="dl">Periodo</span>
        <div className="seg sm full" role="group" aria-label="Periodo">
          ${FROMS.map(y=>html`<button key=${String(y)} aria-pressed=${fromC===y?"true":"false"} onClick=${()=>setFrom(y)}>${y==null?"Todo":(FROMS.length>3?"":"Desde ")+y}</button>`)}
        </div>
        <span className="dl">Escala</span>
        <div className="seg sm full" role="group" aria-label="Escala vertical">
          <button aria-pressed=${!logY?"true":"false"} onClick=${()=>setLogY(false)}>Lineal</button>
          <button aria-pressed=${logY?"true":"false"} onClick=${()=>setLogY(true)}>Log</button>
        </div>
      </div>
      <div className="note"><${Ic} n="Lightbulb" size=${16} color="#ffb547"/><span>${ser.note}</span></div>
      <div className="src">Escala de tiempo real · puntos ámbar: hitos de la curva · Fuente: ${ser.src}</div>
    </div>
  </div>`;
}

/* ───────── App ───────── */
function App(){
  const [mode,setMode]=useState("hist");
  const [overview,setOverview]=useState(true);
  const [idx,setIdx]=useState(0);
  const [open,setOpen]=useState(false);
  const [playing,setPlaying]=useState(false);
  const future=false;
  const stops=ALL;
  const go=useCallback(i=>{setOverview(false);setOpen(false);setIdx(Math.max(0,Math.min(stops.length-1,i)))},[stops]);
  useEffect(()=>{if(!playing)return;const t=setInterval(()=>{setOverview(false);setOpen(false);setIdx(i=>{if(i>=stops.length-1){setPlaying(false);return i}return i+1})},3400);return()=>clearInterval(t)},[playing,stops]);
  useEffect(()=>{const f=e=>{if(mode==="data")return;if(e.key==="ArrowRight")go(overview?0:idx+1);if(e.key==="ArrowLeft")go(idx-1)};window.addEventListener("keydown",f);return()=>window.removeEventListener("keydown",f)},[idx,overview,go,mode]);
  const switchMode=m=>{if(m===mode)return;setMode(m);setPlaying(false);setOpen(false);setIdx(0);setOverview(m==="hist")};
  const jump=id=>{const i=ALL.findIndex(m=>m.id===id);setMode("hist");setPlaying(false);setOverview(false);setOpen(false);setIdx(i)};
  const cur=stops[idx];
  const tag=cur.label;

  return html`<div className="app">
    <div className="top">
      <div className="brand">Gráfica de la evolución <b>tecnológica histórica</b></div>
      <div className="seg" role="group" aria-label="Modo">
        <button aria-pressed=${mode==="hist"?"true":"false"} onClick=${()=>switchMode("hist")}><${Ic} n="Spline" size=${15}/>La curva</button>
        <button aria-pressed=${mode==="data"?"true":"false"} onClick=${()=>switchMode("data")}><${Ic} n="LineChart" size=${15}/>Datos</button>
      </div>
    </div>

    ${mode==="data"?html`<${DataView} onJump=${jump}/>`:html`
    <${Stage} stops=${stops} future=${future} idx=${idx} overview=${overview} onPick=${go}/>
    <div className="hud">
      ${overview?html`<div className="card enter" key=${"ov"+mode}>
          <div className="meta"><span className="pill" style=${{background:"var(--amber)"}}>400.000 a.C. → año 10¹⁰⁰</span></div>
          <div className="title">Plana 400.000 años. Hoy, vertical.</div>
          <div className="ratecmp"><b style=${{color:"#f2a33a"}}>1 invento cada 132.000 años</b><${Ic} n="ArrowRight" size=${16}/><b style=${{color:"#38c8ff"}}>${rateText(PHASES[5].rate).replace("hitos","inventos")}</b></div>
        </div>`
      :html`<div className="card enter" key=${cur.id}>
          <div className="meta">
            <span className="pill" style=${{background:cur.c}}>${String(idx+1).padStart(2,"0")} / ${stops.length}</span>
            <span style=${{color:cur.c}}>${cur.era}</span><span style=${{color:"var(--muted)"}}>· ${tag}</span>
            ${cur.cat&&html`<span style=${{color:"var(--muted)"}}>· ${CATS[cur.cat].name}</span>`}${cur.fut&&cur.k&&cur.off>=80&&html`<span style=${{color:"var(--muted)"}}>· Kardashev ${cur.k}</span>`}
          </div>
          <div className="title">${cur.title}</div>
          <div className="fact">${cur.fact}</div>
          ${(cur.st||cur.vida)&&html`<div className="status">${cur.vida&&html`<span className="vida"><${Ic} n="HeartPulse" size=${13}/>${cur.vida}</span>`}${cur.st&&html`<span><b>Hoy:</b> ${cur.st}</span>`}</div>`}
          ${open?html`<div className="why">${cur.why}</div>`:html`<button className="whybtn" onClick=${()=>setOpen(true)}><${Ic} n="Zap" size=${14} color=${cur.c}/>${cur.cat==="astro"?"¿Por qué importa?":cur.fut?"¿Por qué aceleraría la curva?":"¿Por qué aceleró la curva?"}</button>`}
        </div>`}
      <div className="nav">
        <button className="btn" aria-label="Hito anterior" disabled=${!overview&&idx===0} onClick=${()=>{setPlaying(false);go(overview?0:idx-1)}}><${Ic} n="ChevronLeft" size=${20}/></button>
        <button className="btn main" onClick=${()=>{if(!playing&&idx>=stops.length-1)setIdx(0);if(!playing){setOverview(false)}setPlaying(p=>!p)}}><${Ic} n=${playing?"Pause":"Play"} size=${17}/>${playing?"Pausa":overview?"Empezar viaje":"Viaje"}</button>
        <button className="btn" aria-label="Hito siguiente" disabled=${!overview&&idx===stops.length-1} onClick=${()=>{setPlaying(false);go(overview?0:idx+1)}}><${Ic} n="ChevronRight" size=${20}/></button>
        <button className="btn" aria-label=${overview?"Acercar al hito":"Ver curva completa"} onClick=${()=>{setPlaying(false);setOverview(o=>!o)}}><${Ic} n=${overview?"ZoomIn":"Maximize2"} size=${18}/></button>
      </div>
      <${MiniMap} stops=${stops} idx=${idx} overview=${overview} k=${3.6} onPick=${i=>{setPlaying(false);go(i)}}/>
    </div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);

})();
</script>

</body>
</html>
